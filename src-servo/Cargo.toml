[package]
name = "kestrel"
version = "1.0.0-alpha"
edition = "2021"

[[bin]]
name = "kestrel"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }

# Servo engine via GTK4 wrapper
servo-gtk = { git = "https://github.com/nacho/servo-gtk.git", branch = "main" }

# GTK4 UI — PHẢI khớp với phiên bản servo-gtk dùng (gtk 0.11, glib 0.22, gio 0.22)
gtk4 = { version = "0.11", features = ["v4_12"] }
glib = { version = "0.22", features = ["v2_74"] }
gio = "0.22"

# OpenGL function loader — bắt buộc cho Servo rendering
epoxy = "0.1"
libloading = "0.8"

# Storage — dùng 0.37 để khớp với servo-storage (tránh conflict libsqlite3-sys)
rusqlite = { version = "0.38", features = ["bundled"] }
dirs = "5.0"

# Utils
serde = { version = "1.0", features = ["derive"] }
url = "2.5"
log = "0.4"
env_logger = "0.11"

# Cần cho epoxy::load_with signature (trả về *const c_void)
libc = "0.2"
