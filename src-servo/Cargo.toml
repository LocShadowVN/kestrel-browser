
[package]
name = "kestrel"
version = "1.0.0-alpha"
edition = "2021"
authors = ["LocShadowVN"]
description = "A lightweight, privacy-first Rust web browser built on the Servo 0.6 engine and GTK4."
license = "GPL-3.0-only"
repository = "https://github.com/LocShadowVN/kestrel-browser"
homepage = "https://github.com/LocShadowVN/kestrel-browser"
build = "build.rs"

[[bin]]
name = "kestrel"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
pkcs1 = { workspace = true }

servo-gtk = { git = "https://github.com/LocShadowVN/servo-gtk.git", rev = "ab100f67b40183bdcd78172d61d59c4cff1e5430" }

gtk4 = { version = "0.11", features = ["v4_12"] }
glib = { version = "0.22", features = ["v2_74"] }
gio = "0.22"

rusqlite = { version = "0.38", features = ["bundled"] }
dirs = "5.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
log = "0.4"
env_logger = "0.11"

# Adblock engine — pin exact version; blob format phải khớp giữa Kestrel và
# servo-gtk fork. Bump cả hai cùng lúc khi upgrade.
adblock = "=0.9.8"

[build-dependencies]
ureq = "2.10"

[package.metadata.deb]
maintainer = "LocShadowVN <https://github.com/LocShadowVN>"
copyright = "2026, LocShadowVN"
license-file = ["../LICENSE", "0"]
depends = "$auto, libgtk-4-1 (>= 4.12), libepoxy0, libgbm1, libwayland-client0, libxkbcommon0"
section = "web"
priority = "optional"
assets = [
    ["../target/release/kestrel", "usr/bin/kestrel", "755"],
    ["../README.md", "usr/share/doc/kestrel/README.md", "644"],
]
