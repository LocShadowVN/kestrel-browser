[package]
name = "kestrel"
version = "1.0.0-alpha"
edition = "2021"
build = "build.rs"

[[bin]]
name = "kestrel"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }

# Pin pkcs1 để tránh breaking change của pkcs1 0.8.0-rc.5.
pkcs1 = { workspace = true }

# Fork servo-gtk có adblock.
servo-gtk = { git = "https://github.com/LocShadowVN/servo-gtk.git", rev = "<COMMIT_HASH_FORK>" }

gtk4 = { version = "0.11", features = ["v4_12"] }
glib = { version = "0.22", features = ["v2_74"] }
gio = "0.22"

rusqlite = { version = "0.38", features = ["bundled"] }
dirs = "5.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
ureq = "2.10"
