[package]
name = "kestrel"
version = "1.0.0-alpha"
edition = "2021"
build = "build.rs"

[[bin]]
name = "kestrel"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }
pkcs1 = { workspace = true }

servo-gtk = { git = "https://github.com/LocShadowVN/servo-gtk.git", rev = "3c79d453ed350485cfa3199dc38d0215265faa0d" }

gtk4 = { version = "0.11", features = ["v4_12"] }
glib = { version = "0.22", features = ["v2_74"] }
gio = "0.22"

rusqlite = { version = "0.38", features = ["bundled"] }
dirs = "5.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
log = "0.4"
env_logger = "0.11"

# Adblock engine — pin exact version; blob format phải khớp giữa Kestrel và
# servo-gtk fork. Bump cả hai cùng lúc khi upgrade.
adblock = "=0.9.8"

[build-dependencies]
ureq = "2.10"
