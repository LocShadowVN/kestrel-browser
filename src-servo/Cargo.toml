[package]
name = "kestrel"
version = "1.0.0-alpha"
edition = "2021"

[[bin]]
name = "kestrel"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }

# Pin commit cụ thể của servo-gtk để reproducible.
# Lấy commit hash mới nhất từ: https://github.com/nacho/servo-gtk/commits/main
servo-gtk = { git = "https://github.com/nacho/servo-gtk.git", rev = "dc18d7418bc4373fa84c5a1d3fed0448784a0b34" }

gtk4 = { version = "0.11", features = ["v4_12"] }
glib = { version = "0.22", features = ["v2_74"] }
gio = "0.22"

epoxy = "0.1"
libloading = "0.8"

rusqlite = { version = "0.38", features = ["bundled"] }
dirs = "5.0"

serde = { version = "1.0", features = ["derive"] }
url = "2.5"
log = "0.4"
env_logger = "0.11"

libc = "0.2"
