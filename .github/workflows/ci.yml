name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Servo browser
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build python3 python3-pip \
            pkg-config curl wget file clang llvm \
            libssl-dev libgtk-4-dev libx11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libgbm-dev libwayland-dev libxkbcommon-dev libsqlite3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            shared
            src-servo
          shared-key: kestrel-v1
          cache-all-crates: true
          cache-on-failure: true

      - name: Build release
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        run: cargo build --release --workspace

      - name: Verify binary
        run: |
          ls -lh target/release/kestrel
          file target/release/kestrel

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-linux-x86_64
          path: target/release/kestrel
          retention-days: 30
          if-no-files-found: error
