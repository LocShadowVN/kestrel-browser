name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

  # Build time optimizations (không cần sccache)
  CARGO_INCREMENTAL: "0"
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_BUILD_JOBS: "4"

  # Override release profile cho CI (không sửa Cargo.toml)
  CARGO_PROFILE_RELEASE_LTO: "thin"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_PANIC: "abort"

  # lld linker — nhanh hơn GNU ld
  RUSTFLAGS: "-C link-arg=-fuse-ld=lld"

jobs:
  build:
    name: Build Kestrel
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build python3 python3-pip \
            pkg-config curl wget file clang llvm lld \
            libssl-dev \
            libgtk-4-dev \
            libepoxy-dev \
            libx11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libgbm-dev libwayland-dev libxkbcommon-dev \
            libsqlite3-dev

      - name: Verify toolchain
        run: |
          ld.lld --version
          clang --version | head -1
          rustc --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            shared
            src-servo
          shared-key: kestrel-v3
          cache-all-crates: true
          cache-on-failure: true
          cache-directories: |
            ~/.cargo/git
            ~/.cargo/registry

      - name: Build release
        run: |
          time cargo build --release --workspace

      - name: Verify binary
        run: |
          ls -lh target/release/kestrel
          file target/release/kestrel

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-linux-x86_64
          path: target/release/kestrel
          retention-days: 30
          if-no-files-found: error
