[workspace]
members = [
    "shared",
    "src-servo",
]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# Patch gl_generator để tránh xml-rs 0.7 bị yanked.
# Pin rev cụ thể để reproducible.
[patch.crates-io]
gl_generator = { git = "https://github.com/rust-windowing/gl-rs.git", rev = "dcdd53b9d73166a281b197cff1b5e86071d18927" }
