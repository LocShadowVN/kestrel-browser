[workspace]
members = [
    "shared",
    "src-servo",
]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# Patch epoxy sang fork theCapypara/epoxy-rs.
# epoxy 0.1.0 upstream kéo gl_generator 0.9 → xml-rs 0.7 (yanked) → build fail.
# servo-gtk đã patch epoxy trong Cargo.toml của nó, nhưng patch đó không
# áp dụng khi servo-gtk được dùng như git dependency. Workspace Kestrel
# phải khai báo patch tương tự ở đây.
[patch.crates-io]
epoxy = { git = "https://github.com/theCapypara/epoxy-rs", rev = "7d9d88a8dfec2ddedc647b7a8f6c1e5b3e6c6ec0" }
